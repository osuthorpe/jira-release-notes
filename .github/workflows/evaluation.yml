name: LLM Evaluation

# Costs real OpenAI credits, so it runs only on pull requests that touch the
# prompt or the eval set, or when triggered by hand.
on:
  pull_request:
    branches: [main]
    paths:
      - automated_release_notes.py
      - evals/release_notes.jsonl
      - tests/test_evaluation.py
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Skip notice
        if: env.OPENAI_API_KEY == ''
        run: echo "OPENAI_API_KEY secret is not set; skipping evaluation."

      - name: Run evaluation
        if: env.OPENAI_API_KEY != ''
        run: pytest tests/test_evaluation.py -s
        env:
          RUN_LLM_EVALS: "1"
        continue-on-error: true

      - name: Upload evaluation results
        if: env.OPENAI_API_KEY != '' && always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-results
          path: runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment results on the pull request
        if: github.event_name == 'pull_request' && env.OPENAI_API_KEY != '' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function findReports(dir) {
              if (!fs.existsSync(dir)) return [];
              return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) return findReports(full);
                return entry.name === 'report.txt' ? [full] : [];
              });
            }

            const reports = findReports('runs').sort();
            if (reports.length === 0) {
              console.log('No evaluation report found.');
              return;
            }
            const report = fs.readFileSync(reports[reports.length - 1], 'utf8');
            const excerpt = report.split('\n').slice(0, 30).join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## LLM evaluation results\n\n\`\`\`\n${excerpt}\n\`\`\`\n\nFull results are in the workflow artifacts.`,
            });
