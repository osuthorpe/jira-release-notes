name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 2 * * 2" # weekly, Tuesday 02:15 UTC

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit installed packages for known vulnerabilities
        run: pip-audit --desc on

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Bandit (medium severity and above)
        run: |
          pip install bandit
          bandit -q -ll automated_release_notes.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so old commits are scanned too

      - name: TruffleHog (verified secrets only, fails the job on a hit)
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.97.4 \
            git file:///repo --only-verified --fail
